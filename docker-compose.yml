# =========================================================
#  Smart Factory Platform - รันทั้งระบบด้วยคำสั่งเดียว (W12 Docker)
#  ใช้บน WSL Ubuntu + CasaOS (W10, W11)
#
#    cp .env.example .env      # แล้วแก้ค่า
#    docker compose up -d --build
#
#  Port ที่เปิด
#    1883  Mosquitto (MQTT)
#    1880  Node-RED
#    8086  InfluxDB
#    3003  Grafana (CasaOS)   <- ให้ Grafana บน Windows ใช้ 3000 ได้
#    5679  n8n (5678 อาจชนกับ n8n ที่ลงไว้ในเครื่อง)
# =========================================================
name: smartfactory

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sf-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  simulator:
    build: ./simulator
    image: smartfactory/simulator:latest
    container_name: sf-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - TICK_SEC=${TICK_SEC:-2}
      - FAULT_PROB=${FAULT_PROB:-0.0005}
      - FAULT_SPEED=${FAULT_SPEED:-1.5}
      - TZ=${TZ:-Asia/Bangkok}

  influxdb:
    image: influxdb:2.7
    container_name: sf-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2

  nodered:
    image: nodered/node-red:latest
    container_name: sf-nodered
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    ports:
      - "1880:1880"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ALLOWED=${TELEGRAM_ALLOWED}
      - SHEETS_URL=${SHEETS_URL}
      - FORM_PREFILL_URL=${FORM_PREFILL_URL}
      - HIVEMQ_PREFIX=${HIVEMQ_PREFIX}
      - HIVEMQ_DATA_TOPIC=${HIVEMQ_DATA_TOPIC}
      - N8N_URL=http://n8n:5678
      - CMD_API_KEY=${CMD_API_KEY:-}
    volumes:
      # โฟลเดอร์ nodered/ คือ /data ของ Node-RED (มี flows.json พร้อมใช้)
      - ./nodered:/data

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sf-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_DEFAULT_THEME=dark
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  n8n:
    image: n8nio/n8n:latest
    container_name: sf-n8n
    restart: unless-stopped
    # ครั้งแรก: import + publish workflow จากโฟลเดอร์ n8n/ อัตโนมัติ
    # ครั้งต่อไป: ข้าม (ไม่เขียนทับ workflow ที่แก้/Publish ใน UI แล้ว)
    entrypoint: ["/bin/sh", "-c", "if n8n export:workflow --id=SFaskAI000000001 --output=/tmp/chk.json >/dev/null 2>&1; then echo 'n8n: workflows already exist - skip import'; else n8n import:workflow --separate --input=/workflows; for id in SFshiftReport001 SFaskAI000000001; do n8n publish:workflow --id=$$id || true; done; fi; exec n8n start"]
    depends_on:
      - influxdb
    ports:
      - "5679:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ:-Asia/Bangkok}
      - TZ=${TZ:-Asia/Bangkok}
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - AI_API_KEY=${AI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  mosquitto_data:
  influx_data:
  influx_config:
  grafana_data:
  n8n_data:
