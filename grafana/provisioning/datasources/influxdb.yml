# Grafana datasource provisioning (ใช้ได้ทั้ง CasaOS Docker / Windows / Azure Ubuntu)
# ค่า $INFLUX_* อ่านจาก environment variable ของ Grafana
apiVersion: 1
datasources:
  - name: InfluxDB-Factory
    uid: influxdb-factory
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 2s
    secureJsonData:
      token: $INFLUX_TOKEN
